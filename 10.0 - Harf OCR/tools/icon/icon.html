<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=block">
<style>
  html, body { margin: 0; background: transparent; }
  .icon {
    width: 512px; height: 512px; border-radius: 112px; box-sizing: border-box;
    background: oklch(36% 0.14 268); color: oklch(97.4% 0.008 262);
    display: grid; place-items: center; overflow: hidden;
  }
  .icon span { font: 700 228px/1 "Amiri", serif; transform: translate(4px, -12px); }
</style></head>
<body><div class="icon"><span>حرف</span></div></body></html>
